name: CI

# M9: continuous integration for the Electricalskart Help Desk PWA.
# Mirrors the verification suite documented in README.md > Testing:
#   npm run lint                       ESLint; exits non-zero on errors
#   npm test                           Node unit/integration/security/restart tests
#   npm run build                      Production PWA build
#   npm audit --audit-level=moderate   Dependency vulnerability gate
#   npm run test:e2e                   Playwright dual-browser flow (Chromium, fake mic)

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: Lint, unit tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit / integration / security / restart tests
        run: npm test

      - name: Production PWA build
        run: npm run build

      - name: Dependency audit (moderate+)
        run: npm audit --audit-level=moderate

  e2e:
    name: Playwright E2E (Chromium, fake microphone)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build and run dual-browser E2E suite
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
